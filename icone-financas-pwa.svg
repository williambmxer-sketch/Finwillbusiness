<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Porquinho-cofre — ícone de finanças pessoais</title>
  <desc id="desc">Logo minimalista de um porquinho-cofre fofo e simétrico, com moeda dourada e fundo transparente.</desc>

  <defs>
    <linearGradient id="head" x1="300" y1="310" x2="736" y2="834" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB7CA"/>
      <stop offset="0.52" stop-color="#FF82A6"/>
      <stop offset="1" stop-color="#F45888"/>
    </linearGradient>
    <linearGradient id="ear" x1="286" y1="255" x2="365" y2="449" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA1BA"/>
      <stop offset="1" stop-color="#F05282"/>
    </linearGradient>
    <linearGradient id="snout" x1="398" y1="580" x2="624" y2="748" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD2DE"/>
      <stop offset="1" stop-color="#FF9DB8"/>
    </linearGradient>
    <linearGradient id="coin" x1="436" y1="91" x2="589" y2="253" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF099"/>
      <stop offset="0.52" stop-color="#FFD05A"/>
      <stop offset="1" stop-color="#FFAD32"/>
    </linearGradient>
    <filter id="softShadow" x="167" y="206" width="690" height="678" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#3B1730" flood-opacity="0.22"/>
    </filter>
    <filter id="coinShadow" x="390" y="51" width="244" height="254" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6E371E" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Fundo intencionalmente transparente. -->

  <!-- Moeda entrando no cofrinho. -->
  <g filter="url(#coinShadow)">
    <circle cx="512" cy="166" r="91" fill="url(#coin)" stroke="#71334B" stroke-width="18"/>
    <circle cx="512" cy="166" r="62" fill="none" stroke="#FFF6C9" stroke-width="10" opacity="0.92"/>
    <path d="M481 184L504 158L526 175L548 143" fill="none" stroke="#71334B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M534 143H548V157" fill="none" stroke="#71334B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#softShadow)">
    <!-- Orelhas arredondadas, posicionadas atrás do rosto. -->
    <path d="M342 418C290 397 259 350 271 296C278 263 313 249 339 270C377 300 399 345 399 397Z"
          fill="url(#ear)" stroke="#3A1832" stroke-width="20" stroke-linejoin="round"/>
    <path d="M682 418C734 397 765 350 753 296C746 263 711 249 685 270C647 300 625 345 625 397Z"
          fill="url(#ear)" stroke="#3A1832" stroke-width="20" stroke-linejoin="round"/>
    <path d="M317 319C342 338 356 362 361 389C333 376 318 353 317 319Z" fill="#FFD4DF" opacity="0.85"/>
    <path d="M707 319C682 338 668 362 663 389C691 376 706 353 707 319Z" fill="#FFD4DF" opacity="0.85"/>

    <!-- Cabeça simétrica: funciona melhor como logo do que um porco de corpo inteiro. -->
    <path d="M512 290C676 290 797 402 797 574C797 753 676 844 512 844C348 844 227 753 227 574C227 402 348 290 512 290Z"
          fill="url(#head)" stroke="#3A1832" stroke-width="22" stroke-linejoin="round"/>

    <!-- Reflexo suave para volume sem perder o minimalismo. -->
    <path d="M331 452C369 358 463 328 558 340" fill="none" stroke="#FFE1E8" stroke-width="28" stroke-linecap="round" opacity="0.34"/>

    <!-- Abertura do cofrinho. -->
    <path d="M436 349C486 337 538 337 588 349" fill="none" stroke="#3A1832" stroke-width="25" stroke-linecap="round"/>

    <!-- Olhos grandes e limpos dão a expressão de mascote. -->
    <ellipse cx="397" cy="532" rx="52" ry="61" fill="#3A1832"/>
    <ellipse cx="627" cy="532" rx="52" ry="61" fill="#3A1832"/>
    <circle cx="378" cy="510" r="16" fill="#FFF9F4"/>
    <circle cx="608" cy="510" r="16" fill="#FFF9F4"/>
    <circle cx="416" cy="558" r="9" fill="#FFCBDB" opacity="0.56"/>
    <circle cx="646" cy="558" r="9" fill="#FFCBDB" opacity="0.56"/>

    <!-- Bochechas. -->
    <ellipse cx="326" cy="622" rx="47" ry="25" fill="#DE3E72" opacity="0.29"/>
    <ellipse cx="698" cy="622" rx="47" ry="25" fill="#DE3E72" opacity="0.29"/>

    <!-- Focinho central arredondado. -->
    <rect x="381" y="592" width="262" height="169" rx="84.5" fill="url(#snout)" stroke="#3A1832" stroke-width="18"/>
    <ellipse cx="462" cy="671" rx="19" ry="28" fill="#87304F"/>
    <ellipse cx="562" cy="671" rx="19" ry="28" fill="#87304F"/>
    <path d="M478 720C499 738 525 738 546 720" fill="none" stroke="#87304F" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- Detalhes externos equilibram a composição sem formar um background. -->
  <path d="M827 374V423M803 399H852" stroke="#24C8B5" stroke-width="18" stroke-linecap="round"/>
  <path d="M180 487V525M161 506H199" stroke="#FFC84D" stroke-width="15" stroke-linecap="round"/>
  <circle cx="823" cy="691" r="15" fill="#FFC84D"/>
</svg>
